; Goes in: Fallout 4/Data/F4SE/Plugins/FO4LuantiBridge.ini

[Bridge]
Host=127.0.0.1
Port=8765
PollMs=100

[Blocks]
; Base object spawned for every Luanti block (8-digit hex FormID).
; Find one in-game: open the console (~) and type  help concrete 4
; then pick a STAT entry. 0 = sync positions only, spawn nothing.
BlockBaseFormID=0
; Scale so one object is about 70 units (1 Luanti block) wide.
BlockScale=1.0
